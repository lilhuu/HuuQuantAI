<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HUU Auto Trade Console 启动中</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #061520;
        --panel: #0c2133;
        --line: rgba(120, 220, 255, 0.22);
        --text: #ecfbff;
        --muted: #8fb5c7;
        --accent: #24d4d9;
        --danger: #ff6b6b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at 20% 20%, rgba(36, 212, 217, 0.18), transparent 34%),
          radial-gradient(circle at 78% 12%, rgba(255, 198, 92, 0.13), transparent 30%),
          var(--bg);
      }

      .card {
        width: min(620px, calc(100vw - 48px));
        padding: 42px;
        border: 1px solid var(--line);
        border-radius: 28px;
        background: linear-gradient(145deg, rgba(12, 33, 51, 0.94), rgba(5, 17, 28, 0.92));
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
      }

      .kicker {
        margin: 0 0 14px;
        color: var(--accent);
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 34px;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.7;
      }

      .status {
        margin-top: 28px;
        padding: 18px 20px;
        border-radius: 18px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.04);
      }

      .loader {
        width: 48px;
        height: 48px;
        margin-top: 30px;
        border: 4px solid rgba(255, 255, 255, 0.1);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }

      .actions {
        display: none;
        gap: 12px;
        margin-top: 28px;
      }

      button {
        border: 0;
        border-radius: 999px;
        padding: 13px 18px;
        cursor: pointer;
        font-weight: 800;
        color: #04151d;
        background: var(--accent);
      }

      button.secondary {
        color: var(--text);
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid var(--line);
      }

      .failed .loader {
        display: none;
      }

      .failed .actions {
        display: flex;
      }

      .failed .status {
        color: var(--danger);
        border-color: rgba(255, 107, 107, 0.35);
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <main class="card" id="card">
      <p class="kicker">HUU Auto Trade Console</p>
      <h1>正在启动交易内核</h1>
      <p>桌面壳已经就绪，正在启动本地 FastAPI 服务并加载交易工作台。</p>
      <div class="loader"></div>
      <div class="status" id="status">正在准备运行环境...</div>
      <div class="actions">
        <button id="retry">重试启动</button>
        <button class="secondary" id="logs">打开日志目录</button>
      </div>
    </main>

    <script>
      const card = document.getElementById("card");
      const statusEl = document.getElementById("status");
      const retryButton = document.getElementById("retry");
      const logsButton = document.getElementById("logs");

      window.desktopApi?.onStatus((payload) => {
        statusEl.textContent = payload?.message || "正在启动...";
        if (payload?.type === "failed" || payload?.type === "backend-error" || payload?.type === "backend-exit") {
          card.classList.add("failed");
        }
      });

      retryButton.addEventListener("click", async () => {
        card.classList.remove("failed");
        statusEl.textContent = "正在重试启动交易内核...";
        try {
          await window.desktopApi.retryBackend();
        } catch (error) {
          card.classList.add("failed");
          statusEl.textContent = error?.message || "重试失败，请查看日志。";
        }
      });

      logsButton.addEventListener("click", () => {
        window.desktopApi.openLogs();
      });
    </script>
  </body>
</html>
