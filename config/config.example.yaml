crypto:
  enabled: true
  exchange: binance
  default_quote_currency: USDT
  timeout: 10000
  symbols:
    - BTC/USDT
    - ETH/USDT
    - SOL/USDT
  proxy: ""  # HTTP/SOCKS5 proxy URL, e.g. "http://127.0.0.1:7890" for Mainland China users
  paper:
    broker_name: CryptoPaperBroker
    initial_cash: 10000
    fee_rate: 0.001
    slippage_rate: 0.0005
    paper_order_enabled: true
    real_trading_enabled: false
    max_order_notional: 2000
    max_position_ratio: 0.5
    partial_fill_enabled: true
    partial_fill_min_notional: 3000
    partial_fill_ratio: 0.6
    quantity_precision: 8
    price_precision: 8
  testnet:
    enabled: false
    exchange: binance
    base_url: https://testnet.binance.vision
    api_key: ${BINANCE_TESTNET_API_KEY}
    api_secret: ${BINANCE_TESTNET_API_SECRET}
    credential_store_path: data/binance_testnet_credentials.enc
    credential_key_path: data/binance_testnet.key
    real_trading_enabled: false
    dry_run: true
    required_confirmation: I_UNDERSTAND_CRYPTO_TESTNET
    confirm_testnet_trading: ''
  mainnet:
    enabled: false
    real_trading_enabled: false
  macro:
    enabled: true
    fred_api_key: ${FRED_API_KEY}
    block_threshold: -0.30
    reduce_threshold: -0.10
    risk_on_threshold: 0.20
  regime:
    trend_threshold: 0.35
    trend_multiplier: 15.0
    symbol_trend_multipliers:
      BTC: 15.0
      ETH: 18.0
      SOL: 22.0

risk:
  max_order_notional: 2000
  max_symbol_position_ratio: 0.5
  max_total_position_ratio: 0.8
  max_daily_trades: 30
  allow_short_selling: false
  allow_leverage: false
  real_trading_enabled: false

notifications:
  smtp:
    host: ${HUU_SMTP_HOST}
    port: 465
    user: ${HUU_SMTP_USER}
    pass: ${HUU_SMTP_PASSWORD}
    recipient: ${HUU_SMTP_RECIPIENT}

trading:
  mode: crypto_paper
  real_trading_enabled: false
  dry_run: true
  connect_on_init: false

auto_trading:
  enabled: false
  mode: paper
  decision_mode: ai_supervised
  symbols:
    - BTC/USDT
    - ETH/USDT
    - SOL/USDT
  period: 1h
  timeframes: []
  scan_interval_seconds: 30
  max_positions: 3
  per_trade_position_ratio: 0.1
  max_order_notional: 300
  min_order_notional: 10
  confidence_threshold: 0.35
  ai_model: deepseek-v4-pro
  ai_fallback_model: deepseek-v4-flash
  ai_on_new_candle_only: true
  ai_confidence_threshold: 0.65
  stop_loss_pct: 0.02
  take_profit_pct: 0.04
  max_daily_loss: 200
  max_consecutive_losses: 3
  cooldown_minutes: 60
  real_trading_enabled: false
  strategies:
    - strategy_id: auto_rsi
      type: rsi
      symbols:
        - BTC/USDT
        - ETH/USDT
        - SOL/USDT
      weight: 1.0
      enabled: true
      parameters:
        period: 14
        oversold: 30
        overbought: 70
        position_ratio: 0.08
    - strategy_id: auto_macd
      type: macd
      symbols:
        - BTC/USDT
        - ETH/USDT
        - SOL/USDT
      weight: 0.8
      enabled: true
      parameters:
        position_ratio: 0.06

ai:
  enabled: false
  provider: deepseek
  model: deepseek-v4-flash
  fallback_model: deepseek-v4-flash
  api_key_env: DEEPSEEK_API_KEY
  base_url: https://api.deepseek.com
  mode: advisory
  manual_confirm_required: true
  auto_paper_order_enabled: false
  min_confidence_for_order: 0.65
  max_context_candles: 120
  max_order_notional: 300

storage:
  db_path: data/trading.db
  csv_path: data/crypto_quotes.csv
  max_history_days: 30

database:
  engine: sqlite
  sqlite_path: data/trading.db
  route: sqlite_runtime
  note: PostgreSQL migration is planned but not active in this build.

system:
  auto_start: false
  status_interval: 30
